[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushiengine-cli"
version = "0.1.0"
description = "SushiEngine developer CLI (build / test / run)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

# `se climatology bake` reads NetCDF reanalysis and rasterises coastline vectors. Those
# are heavy wheels (netCDF4 carries HDF5) and the bake is a rare, developer-only step
# whose output is committed — so every other `se` command stays installable without them,
# and the bake fails with this install line rather than an ImportError traceback.
[project.optional-dependencies]
climatology = [
    "numpy>=1.24",
    "requests>=2.28",
    "netCDF4>=1.6",
]

# `se planet bake` reads PDS3 elevation rasters and reprojects them onto the cube-sphere.
# Deliberately lighter than the climatology extra: the planetary science community ships
# global topography as a raw binary raster beside a plain-text label, so the bake needs
# numpy and a downloader and no geospatial stack at all — no GDAL, no rasterio, no
# projection library. Same reasoning otherwise: a rare developer-only step whose inputs are
# hundreds of megabytes, so every other `se` command stays installable without it.
planet = [
    "numpy>=1.24",
    "requests>=2.28",
]

# sushicli (shared CLI presentation layer, see D:/Projects/sushicli) is
# intentionally NOT listed above: it isn't published to any index, so a bare
# "sushicli>=0.1.0" dependency can't be resolved by pip/pipx from a clean
# environment. `pip install -e cli` expects it already installed once in the
# same environment (`pip install -e ../sushicli`).

[project.scripts]
se = "sushiengine.cli:app"
sushiengine = "sushiengine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushiengine*"]

[tool.setuptools.package-data]
sushiengine = ["py.typed"]
