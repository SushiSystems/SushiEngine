name: Bug report
description: Report a defect in SushiEngine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give us enough to reproduce it.
        For **security** issues do NOT use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest reproducer you can manage, including the exact command.
      placeholder: |
        1. se build
        2. se editor
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - simulation (task graph / integrators)
        - render (Vulkan / render graph)
        - editor
        - atmosphere / sky
        - audio
        - CLI / build
        - other / not sure
    validations:
      required: true
  - type: input
    id: build-config
    attributes:
      label: Build configuration
      placeholder: "Release | Debug ; SushiRuntime commit/pin"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, SYCL toolchain (intel-llvm / adaptivecpp / oneapi), CMake version, GPU, commit hash.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
