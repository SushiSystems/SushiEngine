name: CI

# Functional suite on every push / PR. The engine is the head of the stack, so it
# checks out the SushiRuntime sibling and builds against it, exactly as a local
# `se build` does.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    # Intel oneAPI base image for its pre-integrated, working CPU OpenCL device —
    # avoids reassembling one by hand from an intel/llvm nightly + POCL/oclcpuexp/
    # TBB (kept for the record in git history: needed three increasingly specific
    # fixes — the ICD vendors directory, Intel's own oclcpuexp instead of distro
    # POCL which doesn't implement the cl_intel_unified_shared_memory extension
    # this USM-everywhere architecture depends on for every dispatched kernel, then
    # the exact oneTBB release oclcpuexp validates against after a same-name
    # different-ABI one loaded but silently failed — fragile in a way a
    # pre-integrated image just isn't).
    #
    # The compiler is still icpx (its clang lineage understands -fsycl the same
    # way), but the configure step below invokes it through a clang++-named
    # symlink rather than as "icpx" directly: cmake/Sycl.cmake infers
    # SR_SYCL_TOOLCHAIN from the compiler executable's name, and forces it to
    # "oneapi" — real find_package(IntelSYCL) — whenever that name matches
    # icpx/icx-cl/icx. On this image's oneAPI 2025.3.3, that path never creates
    # the IntelSYCL::SYCL_CXX imported target add_sycl_to_target() needs
    # (confirmed directly — every sushiengine_add_sycl_executable() configure step
    # failed with "non-existent target"), which is exactly the failure the very
    # first version of this file was written to avoid. Renaming the invocation to
    # match Sycl.cmake's "clang++" pattern instead selects its intel-llvm branch,
    # which sidesteps find_package(IntelSYCL) entirely (bare -fsycl compile/link
    # flags, a stub add_sycl_to_target()) — a plain -D flag can't do this, since
    # Sycl.cmake's own inference uses CACHE ... FORCE and would just overwrite it.
    container:
      image: intel/oneapi-basekit:latest
    steps:
      # Engine into sushiengine/, runtime sibling into sushiruntime/, so the
      # engine's default SUSHIRUNTIME_DIR (../sushiruntime) resolves to it.
      - name: Check out SushiEngine
        uses: actions/checkout@v4
        with:
          path: sushiengine

      - name: Check out the SushiRuntime sibling
        uses: actions/checkout@v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: main
          path: sushiruntime

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git libhwloc-dev libgtest-dev nlohmann-json3-dev

      - name: Configure, build, and run the functional suite
        shell: bash
        working-directory: sushiengine
        run: |
          set -e
          source /opt/intel/oneapi/setvars.sh --force
          # cmake/Sycl.cmake infers SR_SYCL_TOOLCHAIN from the compiler executable
          # name with `set(... CACHE STRING "" FORCE)`, which overwrites a
          # command-line -DSR_SYCL_TOOLCHAIN=intel-llvm unconditionally whenever the
          # name matches its "icpx|icx-cl|icx" pattern — a flag alone can't select
          # the intel-llvm branch while still invoking icpx. A symlinked name that
          # matches the "clang++" pattern instead routes it there for real: the
          # compiler identifies as IntelLLVM either way (that's --version output,
          # not the invoked name), so this changes nothing about what actually runs.
          mkdir -p /tmp/sycl-cxx
          ln -sf "$(command -v icpx)" /tmp/sycl-cxx/clang++
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=/tmp/sycl-cxx/clang++ \
            -DCMAKE_CXX_FLAGS=-fsycl \
            -DSUSHIRUNTIME_DIR="${GITHUB_WORKSPACE}/sushiruntime" \
            -DSUSHIENGINE_BUILD_TESTS=ON \
            -DSR_BUILD_BENCHMARKS=OFF        # the engine pulls the runtime in; skip its heavy benchmarks
          cmake --build build
          ctest --test-dir build -L "unit|integration|regression" --output-on-failure

  editor:
    name: Editor shell
    runs-on: ubuntu-latest
    # Same SYCL toolchain as the functional job (see its comment): the engine's
    # root CMakeLists always pulls the runtime subdirectory in, so even an
    # editor-only configure needs it. We build only the sushiengine_editor target, so the
    # runtime itself is configured but never compiled.
    #
    # SUSHIENGINE_BUILD_EDITOR forces SUSHIENGINE_BUILD_RENDER on, which needs Vulkan-Headers,
    # Vulkan-Loader, VMA, vk-bootstrap, glslang, stb, cgltf, and nlohmann-json
    # (engine/presentation/render/CMakeLists.txt, applications/editor/CMakeLists.txt). vk-bootstrap and
    # cgltf have
    # no Linux apt package (cli/sushistack.deps.toml lists empty linux_apt for
    # both), so this job provisions all of them from a throwaway vcpkg checkout
    # rather than mixing apt and vcpkg per-package.
    env:
      # Same toolchain date as the functional job. This job never executes a kernel
      # (configure + build sushiengine_editor only, no ctest), so it was never affected by the
      # functional job's OpenCL runtime issue — see that job's comments for the story.
      INTEL_LLVM_DATE: 2026-06-12
    steps:
      - name: Check out SushiEngine
        uses: actions/checkout@v4
        with:
          path: sushiengine
          submodules: recursive        # Dear ImGui lives in third_party/imgui

      - name: Check out the SushiRuntime sibling
        uses: actions/checkout@v4
        with:
          repository: SushiSystems/SushiRuntime
          ref: main
          path: sushiruntime

      - name: Install build and editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git libhwloc-dev \
            libsdl2-dev libgl1-mesa-dev wget \
            ocl-icd-opencl-dev ocl-icd-libopencl1

      - name: Install the intel/llvm nightly SYCL bundle
        run: |
          set -e
          wget -q \
            "https://github.com/intel/llvm/releases/download/nightly-${INTEL_LLVM_DATE}/sycl_linux.tar.gz" \
            -O /tmp/sycl_linux.tar.gz
          sudo mkdir -p /opt/llvm-sycl
          sudo tar -xzf /tmp/sycl_linux.tar.gz -C /opt/llvm-sycl --strip-components=1
          echo "/opt/llvm-sycl/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/llvm-sycl/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg and install the renderer's dependencies
        run: |
          set -e
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install --triplet x64-linux \
            vulkan-headers vulkan-loader vulkan-memory-allocator \
            vk-bootstrap glslang stb cgltf nlohmann-json
          echo "VCPKG_ROOT=/tmp/vcpkg" >> "$GITHUB_ENV"

      - name: Configure and build the editor shell
        shell: bash
        working-directory: sushiengine
        run: |
          set -e
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DSUSHIRUNTIME_DIR="${GITHUB_WORKSPACE}/sushiruntime" \
            -DSUSHIENGINE_BUILD_EDITOR=ON \
            -DSUSHIENGINE_BUILD_TESTS=OFF \
            -DSR_BUILD_BENCHMARKS=OFF
          cmake --build build --target sushiengine_editor

  docs:
    name: API docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build the engine API reference
        shell: bash
        run: |
          set -e
          doxygen Doxyfile
          # Surface any undocumented public symbol or missing @param. Reported,
          # not yet fatal: once the log is clean across the public surface, flip
          # this to `exit 1` so the reference can never regress.
          log=docs/api-site/doxygen-warnings.log
          if [ -s "$log" ]; then
            echo "::warning::Doxygen reported documentation gaps in the public API:"
            cat "$log"
          fi

      - name: Upload the generated site
        uses: actions/upload-artifact@v4
        with:
          name: api-site
          path: docs/api-site/html
